<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Manager – Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA12PmJh2DGgujscaZrYmCUAepcqK5P6Bk",
  authDomain:"sudha-lic-website.firebaseapp.com",
  projectId:"sudha-lic-website",
  storageBucket:"sudha-lic-website.firebasestorage.app",
  messagingSenderId:"236994886282",
  appId:"1:236994886282:web:7072b506e8c739430fcb73"
});
var db = firebase.firestore();
</script>
<style>
.form-box{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:28px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:13px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea,.fg select{background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:10px 14px;font-size:14px;outline:none;font-family:inherit}
.fg input:focus,.fg textarea:focus{border-color:#6366f1}
.fg textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.news-list{display:flex;flex-direction:column;gap:12px}
.ni{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.ni img{width:80px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0}
.ni-ph{width:80px;height:60px;background:#0f172a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ni-body{flex:1}
.ni-title{font-size:15px;font-weight:700;margin-bottom:4px}
.ni-sum{font-size:13px;color:#64748b;margin-bottom:6px}
.ni-date{font-size:11px;color:#475569;margin-bottom:8px}
.ni-btns{display:flex;gap:8px}
.btn-e{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-d{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.msg{padding:12px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.ok{background:#14532d22;color:#4ade80;border:1px solid #14532d}
.msg.err{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
.empty{color:#64748b;padding:20px;font-size:14px}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⚙️ Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="upload.html">📤 Upload Media</a>
      <a href="news-manager.html" class="active">📰 News Posts</a>
      <a href="schemes-manager.html">📋 Schemes</a>
      <a href="products-manager.html">🛍️ Products</a>
      <a href="reviews-manager.html">⭐ Reviews</a>
      <a href="../index.html" style="color:#4ade80">🏠 View Website</a>
    </nav>
    <div style="padding:20px">
      <button onclick="logout()" style="width:100%;background:#7f1d1d;color:#fca5a5;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:14px">🚪 Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1>📰 News Manager</h1>
      <p>Create and manage news articles</p>
    </div>
    <div class="form-box">
      <h2 style="color:#f1f5f9;margin-bottom:18px;font-size:17px" id="form-title">➕ Add News Post</h2>
      <input type="hidden" id="edit-id">
      <div class="fg"><label>Headline *</label><input type="text" id="n-title" placeholder="News headline..."></div>
      <div class="fg"><label>Summary</label><input type="text" id="n-summary" placeholder="One line summary..."></div>
      <div class="fg"><label>Full Content</label><textarea id="n-content" placeholder="Write full news content here..."></textarea></div>
      <div class="row2">
        <div class="fg"><label>Category</label>
          <select id="n-cat"><option>General</option><option>Announcement</option><option>Update</option><option>Event</option></select>
        </div>
        <div class="fg"><label>Image URL (optional)</label>
          <input type="text" id="n-img" placeholder="Paste image URL here">
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn-primary" id="save-btn" onclick="saveNews()">💾 Publish</button>
        <button class="btn-secondary" onclick="clearForm()">✖ Cancel</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
    <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">All News (<span id="count">0</span>)</h3>
    <div class="news-list" id="list"><p class="empty">⏳ Loading...</p></div>
  </main>
</div>
<script>
if(!localStorage.getItem('admin_logged_in')) window.location.href='login.html';
function logout(){localStorage.removeItem('admin_logged_in');window.location.href='login.html';}

function showMsg(text,type){var m=document.getElementById('msg');m.textContent=text;m.className='msg '+type;m.style.display='block';setTimeout(function(){m.style.display='none';},4000);}

function saveNews(){
  var title=document.getElementById('n-title').value.trim();
  if(!title){alert('Please enter headline!');return;}
  var btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='⏳ Saving...';
  var editId=document.getElementById('edit-id').value;
  var data={title:title,summary:document.getElementById('n-summary').value.trim(),content:document.getElementById('n-content').value.trim(),category:document.getElementById('n-cat').value,image:document.getElementById('n-img').value.trim(),date:firebase.firestore.FieldValue.serverTimestamp()};
  var p=editId?db.collection('news').doc(editId).update(data):db.collection('news').add(data);
  p.then(function(){showMsg('✅ News saved!','ok');clearForm();loadNews();}).catch(function(e){showMsg('❌ Error: '+e.message,'err');}).finally(function(){btn.disabled=false;btn.textContent='💾 Publish';});
}

function clearForm(){
  document.getElementById('edit-id').value='';
  ['n-title','n-summary','n-content','n-img'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('n-cat').value='General';
  document.getElementById('form-title').textContent='➕ Add News Post';
}

function editNews(id){
  db.collection('news').doc(id).get().then(function(doc){
    var n=doc.data();
    document.getElementById('edit-id').value=id;
    document.getElementById('n-title').value=n.title||'';
    document.getElementById('n-summary').value=n.summary||'';
    document.getElementById('n-content').value=n.content||'';
    document.getElementById('n-cat').value=n.category||'General';
    document.getElementById('n-img').value=n.image||'';
    document.getElementById('form-title').textContent='✏️ Edit News';
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

function deleteNews(id){if(!confirm('Delete this news?'))return;db.collection('news').doc(id).delete().then(loadNews);}

function loadNews(){
  db.collection('news').orderBy('date','desc').get().then(function(snap){
    document.getElementById('count').textContent=snap.size;
    var list=document.getElementById('list');
    if(snap.empty){list.innerHTML='<p class="empty">No news posts yet.</p>';return;}
    var html='';
    snap.forEach(function(doc){
      var n=doc.data();
      html+='<div class="ni">'+(n.image?'<img src="'+n.image+'" alt="">':'<div class="ni-ph">📰</div>')+'<div class="ni-body"><div class="ni-title">'+n.title+'</div>'+(n.summary?'<div class="ni-sum">'+n.summary+'</div>':'')+'<div class="ni-date">'+n.category+(n.date?' • '+new Date(n.date.toDate()).toLocaleDateString('en-IN'):'')+'</div><div class="ni-btns"><button class="btn-e" onclick="editNews(\''+doc.id+'\')">✏️ Edit</button><button class="btn-d" onclick="deleteNews(\''+doc.id+'\')">🗑️ Delete</button></div></div></div>';
    });
    list.innerHTML=html;
  }).catch(function(e){document.getElementById('list').innerHTML='<p style="color:#f87171">❌ '+e.message+'</p>';});
}
loadNews();
</script>
</body>
</html>
