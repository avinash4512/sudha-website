<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – Sudha LIC</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.home-bar{position:fixed;top:0;left:0;right:0;background:#111827;border-bottom:1px solid #1e2d45;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.home-bar .logo{font-size:16px;font-weight:800;color:#6366f1}
.home-btn{background:#6366f1;color:#fff;text-decoration:none;padding:7px 18px;border-radius:8px;font-size:13px;font-weight:700;transition:.2s}
.home-btn:hover{background:#4f46e5}
.login-box{background:#111827;border:1px solid #1e2d45;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin-top:60px}
.lock-icon{font-size:48px;text-align:center;margin-bottom:16px}
h1{font-size:24px;font-weight:800;margin-bottom:6px;color:#6366f1;text-align:center}
.subtitle{color:#64748b;font-size:14px;margin-bottom:28px;text-align:center}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-group input{width:100%;background:#0a0f1e;border:1px solid #1e2d45;border-radius:8px;color:#e2e8f0;padding:12px 16px;font-size:15px;outline:none;transition:.2s}
.form-group input:focus{border-color:#6366f1}
.login-btn{width:100%;background:#6366f1;color:#fff;border:none;border-radius:8px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;margin-top:6px}
.login-btn:hover{background:#4f46e5}
.error-msg{display:none;background:#7f1d1d22;border:1px solid #7f1d1d;border-radius:8px;color:#f87171;font-size:13px;margin-top:12px;padding:10px;text-align:center}
</style>
</head>
<body>

<div class="home-bar">
  <div class="logo">🌟 Sudha LIC Website</div>
  <span style="font-size:12px;color:#64748b">Authorised Access Only</span>
</div>

<div class="login-box">
  <div class="lock-icon">🔐</div>
  <h1>Admin Login</h1>
  <p class="subtitle">Only admin can access this panel</p>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
  </div>

  <button class="login-btn" onclick="doLogin()">🚀 Login</button>
  <div class="error-msg" id="error-msg">❌ Wrong username or password! Try again.</div>
</div>

<script>
/* ✏️ CHANGE YOUR USERNAME AND PASSWORD HERE */
var ADMIN_USER = "admin";
var ADMIN_PASS = "admin123";

function doLogin(){
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value.trim();
  if(u === ADMIN_USER && p === ADMIN_PASS){
    localStorage.setItem('admin_logged_in','yes');
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('error-msg').style.display = 'block';
  }
}
</script>
</body>
</html>
