<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-box{background:#111827;border:1px solid #1e2d45;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .login-box h1{font-size:24px;font-weight:800;margin-bottom:6px;color:#6366f1}
  .login-box p{color:#64748b;font-size:14px;margin-bottom:28px}
  .form-group{margin-bottom:18px}
  .form-group label{display:block;font-size:13px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .form-group input{width:100%;background:#0a0f1e;border:1px solid #1e2d45;border-radius:8px;color:#e2e8f0;padding:12px 16px;font-size:15px;outline:none;transition:.2s}
  .form-group input:focus{border-color:#6366f1}
  .login-btn{width:100%;background:#6366f1;color:#fff;border:none;border-radius:8px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;margin-top:6px}
  .login-btn:hover{background:#4f46e5}
  .error-msg{display:none;color:#f87171;font-size:13px;margin-top:12px;text-align:center}
  .lock-icon{font-size:40px;margin-bottom:16px}
</style>
</head>
<body>
<div class="login-box">
  <div class="lock-icon">🔐</div>
  <h1>Admin Panel</h1>
  <p>Enter your credentials to access the dashboard</p>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="login-btn" onclick="doLogin()">🚀 Login</button>
  <div class="error-msg" id="error-msg">❌ Wrong username or password!</div>
</div>
<script>
  // ✏️ CHANGE YOUR USERNAME AND PASSWORD HERE:
  var ADMIN_USER = "admin";
  var ADMIN_PASS = "admin123";

  function doLogin(){
    var u=document.getElementById('username').value.trim();
    var p=document.getElementById('password').value.trim();
    if(u===ADMIN_USER && p===ADMIN_PASS){
      localStorage.setItem('admin_logged_in','yes');
      window.location.href='dashboard.html';
    } else {
      document.getElementById('error-msg').style.display='block';
    }
  }
</script>
</body>
</html>
