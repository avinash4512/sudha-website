<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews Manager – Admin</title>
<link rel="stylesheet" href="style.css">
<style>
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
  .stat-card{background:#1e293b;border-radius:10px;padding:16px 20px;border:1px solid #334155;text-align:center}
  .stat-card .stat-num{font-size:28px;font-weight:800;color:#6366f1}
  .stat-card .stat-label{font-size:12px;color:#64748b;margin-top:4px}
  .reviews-list{display:flex;flex-direction:column;gap:14px}
  .review-card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;transition:.2s}
  .review-card.pending{border-left:4px solid #fbbf24}
  .review-card.approved{border-left:4px solid #4ade80}
  .review-card.rejected{border-left:4px solid #f87171;opacity:.6}
  .review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .reviewer-info{display:flex;align-items:center;gap:12px}
  .avatar{width:42px;height:42px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
  .reviewer-name{font-weight:700;color:#f1f5f9;font-size:15px}
  .reviewer-service{font-size:12px;color:#64748b;margin-top:2px}
  .stars{color:#fbbf24;font-size:18px;letter-spacing:2px}
  .review-text{color:#94a3b8;line-height:1.6;font-size:14px;margin-bottom:12px}
  .review-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn-approve{background:#14532d22;color:#4ade80;border:1px solid #14532d;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
  .btn-reject{background:#78350f22;color:#fbbf24;border:1px solid #78350f;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
  .btn-del{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
  .status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .status-badge.pending{background:#78350f22;color:#fbbf24;border:1px solid #78350f}
  .status-badge.approved{background:#14532d22;color:#4ade80;border:1px solid #14532d}
  .status-badge.rejected{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
  .filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
  .filter-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer}
  .filter-btn.active,.filter-btn:hover{background:#6366f1;color:#fff;border-color:#6366f1}
  .loading,.empty-state{text-align:center;padding:40px;color:#475569}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA12PmJh2DGgujscaZrYmCUAepcqK5P6Bk",
  authDomain: "sudha-lic-website.firebaseapp.com",
  projectId: "sudha-lic-website",
  storageBucket: "sudha-lic-website.firebasestorage.app",
  messagingSenderId: "236994886282",
  appId: "1:236994886282:web:7072b506e8c739430fcb73"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();
</script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⚙️ AdminPanel</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="upload.html">📤 Upload Media</a>
      <a href="news-manager.html">📰 News Posts</a>
      <a href="schemes-manager.html">📋 Schemes</a>
      <a href="products-manager.html">🛍️ Products & Services</a>
      <a href="reviews-manager.html" class="active">⭐ Reviews</a>
    </nav>
    <div style="padding:20px;margin-top:auto">
      <button onclick="logout()" style="width:100%;background:#7f1d1d;color:#fca5a5;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:14px">🚪 Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1>⭐ Customer Reviews</h1>
      <p>Approve or reject reviews — changes are live instantly</p>
    </div>
    <div class="stats-row" id="stats-row"><div class="stat-card" style="grid-column:1/-1"><p class="loading">⏳ Loading...</p></div></div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterReviews('all',this)">All</button>
      <button class="filter-btn" onclick="filterReviews('pending',this)">⏳ Pending</button>
      <button class="filter-btn" onclick="filterReviews('approved',this)">✅ Approved</button>
      <button class="filter-btn" onclick="filterReviews('rejected',this)">❌ Rejected</button>
      <button style="margin-left:auto;background:#14532d22;color:#4ade80;border:1px solid #14532d;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer" onclick="approveAll()">✅ Approve All Pending</button>
    </div>
    <div class="reviews-list" id="reviews-list"><p class="loading">⏳ Loading...</p></div>
  </main>
</div>
<script>
if(!localStorage.getItem('admin_logged_in')) window.location.href='login.html';
function logout(){localStorage.removeItem('admin_logged_in');window.location.href='login.html';}

let allReviews=[], currentFilter='all';

function setStatus(id,status){
  db.collection('reviews').doc(id).update({status}).then(()=>{
    const r=allReviews.find(r=>r.id===id);
    if(r) r.status=status;
    renderStats(); renderReviews();
  });
}

function deleteReview(id){
  if(!confirm('Delete this review permanently?')) return;
  db.collection('reviews').doc(id).delete().then(()=>{
    allReviews=allReviews.filter(r=>r.id!==id);
    renderStats(); renderReviews();
  });
}

async function approveAll(){
  const pending=allReviews.filter(r=>r.status==='pending');
  const batch=db.batch();
  pending.forEach(r=>batch.update(db.collection('reviews').doc(r.id),{status:'approved'}));
  await batch.commit();
  allReviews=allReviews.map(r=>r.status==='pending'?{...r,status:'approved'}:r);
  renderStats(); renderReviews();
}

function filterReviews(type,btn){
  currentFilter=type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderReviews();
}

function renderStats(){
  const total=allReviews.length;
  const pending=allReviews.filter(r=>r.status==='pending').length;
  const approved=allReviews.filter(r=>r.status==='approved').length;
  const avg=total?(allReviews.reduce((s,r)=>s+r.rating,0)/total).toFixed(1):'0.0';
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Reviews</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#fbbf24">${pending}</div><div class="stat-label">Pending</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#4ade80">${approved}</div><div class="stat-label">Approved</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#fbbf24">${avg} ⭐</div><div class="stat-label">Avg Rating</div></div>`;
}

function renderReviews(){
  const filtered=currentFilter==='all'?allReviews:allReviews.filter(r=>r.status===currentFilter);
  const list=document.getElementById('reviews-list');
  if(!filtered.length){list.innerHTML='<div class="empty-state"><div style="font-size:48px">💬</div><p>No reviews in this category.</p></div>';return;}
  list.innerHTML=filtered.map(r=>`<div class="review-card ${r.status}">
    <div class="review-header">
      <div class="reviewer-info">
        <div class="avatar">${r.name.charAt(0).toUpperCase()}</div>
        <div>
          <div class="reviewer-name">${r.name}</div>
          <div class="reviewer-service">Service: ${r.service||'General'} • ${r.date?new Date(r.date.toDate()).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
        <span class="status-badge ${r.status}">${r.status.toUpperCase()}</span>
      </div>
    </div>
    <div class="review-text">"${r.review}"</div>
    <div class="review-actions">
      ${r.status!=='approved'?`<button class="btn-approve" onclick="setStatus('${r.id}','approved')">✅ Approve</button>`:''}
      ${r.status!=='rejected'?`<button class="btn-reject" onclick="setStatus('${r.id}','rejected')">⛔ Reject</button>`:''}
      <button class="btn-del" onclick="deleteReview('${r.id}')">🗑️ Delete</button>
    </div>
  </div>`).join('');
}

function loadReviews(){
  db.collection('reviews').orderBy('date','desc').get().then(snap=>{
    allReviews=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats(); renderReviews();
  }).catch(e=>document.getElementById('reviews-list').innerHTML=`<p style="color:#f87171">Error: ${e.message}</p>`);
}
loadReviews();
</script>
</body>
</html>
