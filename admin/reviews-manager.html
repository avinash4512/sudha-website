<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews Manager – Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA12PmJh2DGgujscaZrYmCUAepcqK5P6Bk",
  authDomain:"sudha-lic-website.firebaseapp.com",
  projectId:"sudha-lic-website",
  storageBucket:"sudha-lic-website.firebasestorage.app",
  messagingSenderId:"236994886282",
  appId:"1:236994886282:web:7072b506e8c739430fcb73"
});
var db=firebase.firestore();
</script>
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.sc{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155;text-align:center}
.sc .num{font-size:28px;font-weight:800;color:#6366f1}
.sc .lbl{font-size:12px;color:#64748b;margin-top:4px}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.fb{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.fb.active,.fb:hover{background:#6366f1;color:#fff;border-color:#6366f1}
.rev-list{display:flex;flex-direction:column;gap:14px}
.rv{background:#1e293b;border-radius:12px;padding:18px;border:1px solid #334155}
.rv.pending{border-left:4px solid #fbbf24}
.rv.approved{border-left:4px solid #4ade80}
.rv.rejected{border-left:4px solid #f87171;opacity:.6}
.rv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.rv-user{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.rv-name{font-weight:700;font-size:15px}
.rv-svc{font-size:12px;color:#64748b;margin-top:2px}
.rv-stars{color:#fbbf24;font-size:18px}
.rv-text{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:10px;font-style:italic}
.rv-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-ap{background:#14532d22;color:#4ade80;border:1px solid #14532d;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-rj{background:#78350f22;color:#fbbf24;border:1px solid #78350f;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-dl{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.sbadge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.sbadge.pending{background:#78350f22;color:#fbbf24;border:1px solid #78350f}
.sbadge.approved{background:#14532d22;color:#4ade80;border:1px solid #14532d}
.sbadge.rejected{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
.empty{text-align:center;padding:40px;color:#64748b}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⚙️ Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="upload.html">📤 Upload Media</a>
      <a href="news-manager.html">📰 News Posts</a>
      <a href="schemes-manager.html">📋 Schemes</a>
      <a href="products-manager.html">🛍️ Products</a>
      <a href="reviews-manager.html" class="active">⭐ Reviews</a>
      <a href="../index.html" style="color:#4ade80">🏠 View Website</a>
    </nav>
    <div style="padding:20px">
      <button onclick="logout()" style="width:100%;background:#7f1d1d;color:#fca5a5;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:14px">🚪 Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header"><h1>⭐ Customer Reviews</h1><p>Approve or reject customer reviews</p></div>
    <div class="stats-row" id="stats-row"><div class="sc" style="grid-column:1/-1"><p style="color:#64748b">⏳ Loading...</p></div></div>
    <div class="filter-bar">
      <button class="fb active" onclick="filter('all',this)">All</button>
      <button class="fb" onclick="filter('pending',this)">⏳ Pending</button>
      <button class="fb" onclick="filter('approved',this)">✅ Approved</button>
      <button class="fb" onclick="filter('rejected',this)">❌ Rejected</button>
      <button style="margin-left:auto;background:#14532d22;color:#4ade80;border:1px solid #14532d;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit" onclick="approveAll()">✅ Approve All Pending</button>
    </div>
    <div class="rev-list" id="list"><p class="empty">⏳ Loading...</p></div>
  </main>
</div>
<script>
if(!localStorage.getItem('admin_logged_in')) window.location.href='login.html';
function logout(){localStorage.removeItem('admin_logged_in');window.location.href='login.html';}
var allReviews=[],currentFilter='all';

function setStatus(id,status){
  db.collection('reviews').doc(id).update({status:status}).then(function(){
    var r=allReviews.find(function(r){return r.id===id;});
    if(r)r.status=status;
    renderStats();renderList();
  });
}

function deleteRev(id){
  if(!confirm('Delete this review?'))return;
  db.collection('reviews').doc(id).delete().then(function(){
    allReviews=allReviews.filter(function(r){return r.id!==id;});
    renderStats();renderList();
  });
}

function approveAll(){
  var pending=allReviews.filter(function(r){return r.status==='pending';});
  if(!pending.length){alert('No pending reviews!');return;}
  var batch=db.batch();
  pending.forEach(function(r){batch.update(db.collection('reviews').doc(r.id),{status:'approved'});});
  batch.commit().then(function(){
    allReviews=allReviews.map(function(r){return r.status==='pending'?Object.assign({},r,{status:'approved'}):r;});
    renderStats();renderList();
  });
}

function filter(type,btn){
  currentFilter=type;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderList();
}

function renderStats(){
  var total=allReviews.length;
  var pending=allReviews.filter(function(r){return r.status==='pending';}).length;
  var approved=allReviews.filter(function(r){return r.status==='approved';}).length;
  var avg=total?(allReviews.reduce(function(s,r){return s+r.rating;},0)/total).toFixed(1):'0.0';
  document.getElementById('stats-row').innerHTML=
    '<div class="sc"><div class="num">'+total+'</div><div class="lbl">Total</div></div>'+
    '<div class="sc"><div class="num" style="color:#fbbf24">'+pending+'</div><div class="lbl">Pending</div></div>'+
    '<div class="sc"><div class="num" style="color:#4ade80">'+approved+'</div><div class="lbl">Approved</div></div>'+
    '<div class="sc"><div class="num" style="color:#fbbf24">'+avg+' ⭐</div><div class="lbl">Avg Rating</div></div>';
}

function renderList(){
  var items=currentFilter==='all'?allReviews:allReviews.filter(function(r){return r.status===currentFilter;});
  var list=document.getElementById('list');
  if(!items.length){list.innerHTML='<div class="empty"><div style="font-size:48px">💬</div><p>No reviews here.</p></div>';return;}
  var html='';
  items.forEach(function(r){
    html+='<div class="rv '+r.status+'"><div class="rv-top"><div class="rv-user"><div class="av">'+r.name.charAt(0).toUpperCase()+'</div><div><div class="rv-name">'+r.name+'</div><div class="rv-svc">'+(r.service||'General')+'</div></div></div><div style="display:flex;align-items:center;gap:8px"><div class="rv-stars">'+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+'</div><span class="sbadge '+r.status+'">'+r.status.toUpperCase()+'</span></div></div><div class="rv-text">"'+r.review+'"</div><div class="rv-btns">'+(r.status!=='approved'?'<button class="btn-ap" onclick="setStatus(\''+r.id+'\',\'approved\')">✅ Approve</button>':'')+(r.status!=='rejected'?'<button class="btn-rj" onclick="setStatus(\''+r.id+'\',\'rejected\')">⛔ Reject</button>':'')+'<button class="btn-dl" onclick="deleteRev(\''+r.id+'\')">🗑️ Delete</button></div></div>';
  });
  list.innerHTML=html;
}

function loadReviews(){
  db.collection('reviews').orderBy('date','desc').get().then(function(snap){
    allReviews=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderStats();renderList();
  }).catch(function(e){document.getElementById('list').innerHTML='<p style="color:#f87171">❌ '+e.message+'</p>';});
}
loadReviews();
</script>
</body>
</html>
