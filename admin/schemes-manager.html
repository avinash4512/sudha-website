<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schemes Manager – Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA12PmJh2DGgujscaZrYmCUAepcqK5P6Bk",
  authDomain:"sudha-lic-website.firebaseapp.com",
  projectId:"sudha-lic-website",
  storageBucket:"sudha-lic-website.firebasestorage.app",
  messagingSenderId:"236994886282",
  appId:"1:236994886282:web:7072b506e8c739430fcb73"
});
var db = firebase.firestore();
</script>
<style>
.form-box{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:28px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:13px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea,.fg select{background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:10px 14px;font-size:14px;outline:none;font-family:inherit}
.fg input:focus,.fg textarea:focus{border-color:#6366f1}
.fg textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scheme-list{display:flex;flex-direction:column;gap:12px}
.sc{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.sc-name{font-size:15px;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.active{background:#14532d22;color:#4ade80;border:1px solid #14532d}
.badge.upcoming{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af}
.badge.closed{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
.sc-desc{font-size:13px;color:#64748b;margin-bottom:6px}
.sc-meta{font-size:12px;color:#475569;margin-bottom:8px}
.sc-btns{display:flex;gap:8px}
.btn-e{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-d{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.msg{padding:12px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.ok{background:#14532d22;color:#4ade80;border:1px solid #14532d}
.msg.err{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
.empty{color:#64748b;padding:20px;font-size:14px}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⚙️ Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="upload.html">📤 Upload Media</a>
      <a href="news-manager.html">📰 News Posts</a>
      <a href="schemes-manager.html" class="active">📋 Schemes</a>
      <a href="products-manager.html">🛍️ Products</a>
      <a href="reviews-manager.html">⭐ Reviews</a>
      <a href="../index.html" style="color:#4ade80">🏠 View Website</a>
    </nav>
    <div style="padding:20px">
      <button onclick="logout()" style="width:100%;background:#7f1d1d;color:#fca5a5;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:14px">🚪 Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1>📋 Schemes Manager</h1>
      <p>Add and manage schemes — saved to Firebase</p>
    </div>

    <div class="form-box">
      <h2 style="color:#f1f5f9;margin-bottom:18px;font-size:17px" id="form-title">➕ Add New Scheme</h2>
      <input type="hidden" id="edit-id">
      <div class="fg"><label>Scheme Name *</label><input type="text" id="s-name" placeholder="e.g. PM Kisan Yojana"></div>
      <div class="fg"><label>Description</label><textarea id="s-desc" placeholder="What is this scheme about?"></textarea></div>
      <div class="row2">
        <div class="fg"><label>Who Can Apply</label><input type="text" id="s-eligible" placeholder="e.g. Farmers, Women..."></div>
        <div class="fg"><label>Benefit / Amount</label><input type="text" id="s-benefit" placeholder="e.g. ₹6000/year"></div>
      </div>
      <div class="row2">
        <div class="fg"><label>Last Date</label><input type="date" id="s-date"></div>
        <div class="fg"><label>Status</label>
          <select id="s-status">
            <option value="active">✅ Active</option>
            <option value="upcoming">🔜 Upcoming</option>
            <option value="closed">❌ Closed</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn-primary" id="save-btn" onclick="saveScheme()">💾 Save Scheme</button>
        <button class="btn-secondary" onclick="clearForm()">✖ Cancel</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">All Schemes (<span id="count">0</span>)</h3>
    <div class="scheme-list" id="list"><p class="empty">⏳ Loading...</p></div>
  </main>
</div>

<script>
if(!localStorage.getItem('admin_logged_in')) window.location.href='login.html';
function logout(){localStorage.removeItem('admin_logged_in');window.location.href='login.html';}

function showMsg(text, type){
  var m=document.getElementById('msg');
  m.textContent=text; m.className='msg '+type; m.style.display='block';
  setTimeout(function(){m.style.display='none';},4000);
}

function saveScheme(){
  var name=document.getElementById('s-name').value.trim();
  if(!name){alert('Please enter scheme name!');return;}
  var btn=document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='⏳ Saving...';
  var editId=document.getElementById('edit-id').value;
  var data={
    name:name,
    description:document.getElementById('s-desc').value.trim(),
    eligible:document.getElementById('s-eligible').value.trim(),
    benefit:document.getElementById('s-benefit').value.trim(),
    lastDate:document.getElementById('s-date').value,
    status:document.getElementById('s-status').value,
    date:firebase.firestore.FieldValue.serverTimestamp()
  };
  var promise = editId ? db.collection('schemes').doc(editId).update(data) : db.collection('schemes').add(data);
  promise.then(function(){
    showMsg('✅ Scheme saved successfully!','ok');
    clearForm();
    loadSchemes();
  }).catch(function(e){
    showMsg('❌ Error: '+e.message,'err');
    console.error(e);
  }).finally(function(){
    btn.disabled=false; btn.textContent='💾 Save Scheme';
  });
}

function clearForm(){
  document.getElementById('edit-id').value='';
  document.getElementById('s-name').value='';
  document.getElementById('s-desc').value='';
  document.getElementById('s-eligible').value='';
  document.getElementById('s-benefit').value='';
  document.getElementById('s-date').value='';
  document.getElementById('s-status').value='active';
  document.getElementById('form-title').textContent='➕ Add New Scheme';
}

function editScheme(id){
  db.collection('schemes').doc(id).get().then(function(doc){
    var s=doc.data();
    document.getElementById('edit-id').value=id;
    document.getElementById('s-name').value=s.name||'';
    document.getElementById('s-desc').value=s.description||'';
    document.getElementById('s-eligible').value=s.eligible||'';
    document.getElementById('s-benefit').value=s.benefit||'';
    document.getElementById('s-date').value=s.lastDate||'';
    document.getElementById('s-status').value=s.status||'active';
    document.getElementById('form-title').textContent='✏️ Edit Scheme';
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

function deleteScheme(id){
  if(!confirm('Delete this scheme?')) return;
  db.collection('schemes').doc(id).delete().then(loadSchemes);
}

function loadSchemes(){
  db.collection('schemes').orderBy('date','desc').get().then(function(snap){
    document.getElementById('count').textContent=snap.size;
    var list=document.getElementById('list');
    if(snap.empty){list.innerHTML='<p class="empty">No schemes yet. Add your first one above!</p>';return;}
    var html='';
    snap.forEach(function(doc){
      var s=doc.data();
      html+='<div class="sc">'+
        '<div class="sc-top">'+
          '<div class="sc-name">'+s.name+'</div>'+
          '<span class="badge '+s.status+'">'+(s.status==='active'?'✅ Active':s.status==='upcoming'?'🔜 Upcoming':'❌ Closed')+'</span>'+
        '</div>'+
        (s.description?'<div class="sc-desc">'+s.description+'</div>':'')+
        '<div class="sc-meta">'+(s.eligible?'👥 '+s.eligible+' &nbsp;':'')+(s.benefit?'💰 '+s.benefit:'')+'</div>'+
        '<div class="sc-btns">'+
          '<button class="btn-e" onclick="editScheme(\''+doc.id+'\')">✏️ Edit</button>'+
          '<button class="btn-d" onclick="deleteScheme(\''+doc.id+'\')">🗑️ Delete</button>'+
        '</div>'+
      '</div>';
    });
    list.innerHTML=html;
  }).catch(function(e){
    document.getElementById('list').innerHTML='<p style="color:#f87171">❌ Error loading: '+e.message+'</p>';
  });
}
loadSchemes();
</script>
</body>
</html>
