<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Manager – Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../firebase-config.js"></script>
<style>
  .product-form{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:28px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-row.three{grid-template-columns:1fr 1fr 1fr}
  .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .form-group label{font-size:13px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .form-group input,.form-group textarea,.form-group select{background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:10px 14px;font-size:14px;outline:none;transition:.2s}
  .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#6366f1}
  .form-group textarea{min-height:80px;resize:vertical}
  .img-upload-area{background:#0f172a;border:2px dashed #334155;border-radius:8px;padding:16px;text-align:center;cursor:pointer;position:relative}
  .img-upload-area:hover{border-color:#6366f1}
  .img-upload-area img{width:100%;max-height:120px;object-fit:cover;border-radius:6px;display:none}
  .img-upload-area .placeholder{color:#475569;font-size:13px}
  .img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload-progress{font-size:12px;color:#6366f1;margin-top:6px;display:none}
  .filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .filter-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;transition:.2s}
  .filter-btn.active,.filter-btn:hover{background:#6366f1;color:#fff;border-color:#6366f1}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .product-card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;transition:.2s}
  .product-card:hover{border-color:#6366f1;transform:translateY(-2px)}
  .card-img{height:160px;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#475569;font-size:40px;overflow:hidden}
  .card-img img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:14px}
  .card-title{font-size:15px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
  .card-price{font-size:18px;font-weight:800;color:#6366f1;margin-bottom:6px}
  .card-desc{font-size:12px;color:#64748b;margin-bottom:10px;line-height:1.5}
  .card-actions{display:flex;gap:8px}
  .btn-edit{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
  .btn-delete{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
  .badge.product{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af}
  .badge.service{background:#14532d22;color:#4ade80;border:1px solid #14532d}
  .badge.offer{background:#78350f22;color:#fbbf24;border:1px solid #78350f}
  .loading,.empty-state{text-align:center;padding:40px;color:#475569;grid-column:1/-1}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⚙️ AdminPanel</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="upload.html">📤 Upload Media</a>
      <a href="news-manager.html">📰 News Posts</a>
      <a href="schemes-manager.html">📋 Schemes</a>
      <a href="products-manager.html" class="active">🛍️ Products & Services</a>
      <a href="reviews-manager.html">⭐ Reviews</a>
    </nav>
    <div style="padding:20px;margin-top:auto">
      <button onclick="logout()" style="width:100%;background:#7f1d1d;color:#fca5a5;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:14px">🚪 Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1>🛍️ Products & Services</h1>
      <p>Add, edit and manage your offerings — saved to Firebase</p>
    </div>

    <div class="product-form">
      <h2 style="color:#f1f5f9;margin-bottom:20px;font-size:18px" id="form-title">➕ Add New Item</h2>
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group"><label>Name / Title *</label><input type="text" id="p-name" placeholder="e.g. Web Design Package"></div>
        <div class="form-group"><label>Category</label>
          <select id="p-category"><option value="product">🛍️ Product</option><option value="service">🔧 Service</option><option value="offer">🎁 Special Offer</option></select>
        </div>
      </div>
      <div class="form-row three">
        <div class="form-group"><label>Price (₹)</label><input type="text" id="p-price" placeholder="e.g. 999 or Free"></div>
        <div class="form-group"><label>Original Price (₹)</label><input type="text" id="p-original-price" placeholder="for discount"></div>
        <div class="form-group"><label>Status</label>
          <select id="p-status"><option value="available">✅ Available</option><option value="soldout">❌ Sold Out</option><option value="coming">🔜 Coming Soon</option></select>
        </div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="p-desc" placeholder="Describe this product or service..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Features (one per line)</label>
          <textarea id="p-features" placeholder="Free Delivery&#10;24/7 Support&#10;1 Year Warranty" style="min-height:80px"></textarea>
        </div>
        <div class="form-group">
          <label>Image <small style="color:#475569">(upload or paste URL below)</small></label>
          <div class="img-upload-area" id="img-upload-area">
            <div class="placeholder" id="img-placeholder">📷 Click to upload image</div>
            <img id="img-preview" src="" alt="">
            <input type="file" accept="image/*" onchange="uploadProductImage(this)">
          </div>
          <div class="upload-progress" id="upload-progress">⏳ Uploading...</div>
          <input type="text" id="p-img" placeholder="Or paste image URL here" style="margin-top:8px" oninput="previewFromURL(this.value)">
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <button class="btn-primary" id="save-btn" onclick="saveProduct()">💾 Save Item</button>
        <button class="btn-secondary" onclick="clearForm()">✖ Cancel</button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all',this)">All</button>
      <button class="filter-btn" onclick="filterProducts('product',this)">🛍️ Products</button>
      <button class="filter-btn" onclick="filterProducts('service',this)">🔧 Services</button>
      <button class="filter-btn" onclick="filterProducts('offer',this)">🎁 Offers</button>
    </div>
    <div class="product-grid" id="product-grid"><p class="loading">⏳ Loading...</p></div>
  </main>
</div>
<script>
if(!localStorage.getItem('admin_logged_in')) window.location.href='login.html';
function logout(){localStorage.removeItem('admin_logged_in');window.location.href='login.html';}

let allProducts=[], currentFilter='all';

function previewFromURL(url){
  if(!url) return;
  document.getElementById('img-preview').src=url;
  document.getElementById('img-preview').style.display='block';
  document.getElementById('img-placeholder').style.display='none';
}

function uploadProductImage(input){
  if(!input.files[0]) return;
  const file=input.files[0];
  const prog=document.getElementById('upload-progress');
  prog.style.display='block'; prog.textContent='⏳ Uploading image...';
  const ref=storage.ref('products/'+Date.now()+'_'+file.name);
  const task=ref.put(file);
  task.on('state_changed',null,
    err=>{prog.textContent='❌ Upload failed';},
    ()=>task.snapshot.ref.getDownloadURL().then(url=>{
      document.getElementById('p-img').value=url;
      document.getElementById('img-preview').src=url;
      document.getElementById('img-preview').style.display='block';
      document.getElementById('img-placeholder').style.display='none';
      prog.textContent='✅ Image uploaded!';
      setTimeout(()=>prog.style.display='none',2000);
    })
  );
}

async function saveProduct(){
  const name=document.getElementById('p-name').value.trim();
  if(!name){alert('Please enter a name!');return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='Saving...';
  const editId=document.getElementById('edit-id').value;
  const data={
    name,
    category:document.getElementById('p-category').value,
    price:document.getElementById('p-price').value.trim(),
    originalPrice:document.getElementById('p-original-price').value.trim(),
    status:document.getElementById('p-status').value,
    description:document.getElementById('p-desc').value.trim(),
    features:document.getElementById('p-features').value.trim(),
    image:document.getElementById('p-img').value.trim(),
    date:firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    if(editId){ await db.collection('products').doc(editId).update(data); }
    else { await db.collection('products').add(data); }
    clearForm(); loadProducts();
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false; btn.textContent='💾 Save Item';
}

function clearForm(){
  document.getElementById('edit-id').value='';
  ['p-name','p-price','p-original-price','p-desc','p-features','p-img'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('p-category').value='product';
  document.getElementById('p-status').value='available';
  document.getElementById('img-preview').style.display='none';
  document.getElementById('img-placeholder').style.display='block';
  document.getElementById('form-title').textContent='➕ Add New Item';
}

async function editProduct(id){
  const doc=await db.collection('products').doc(id).get();
  const item=doc.data();
  document.getElementById('edit-id').value=id;
  document.getElementById('p-name').value=item.name||'';
  document.getElementById('p-category').value=item.category||'product';
  document.getElementById('p-price').value=item.price||'';
  document.getElementById('p-original-price').value=item.originalPrice||'';
  document.getElementById('p-status').value=item.status||'available';
  document.getElementById('p-desc').value=item.description||'';
  document.getElementById('p-features').value=item.features||'';
  document.getElementById('p-img').value=item.image||'';
  if(item.image){ previewFromURL(item.image); }
  document.getElementById('form-title').textContent='✏️ Edit Item';
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteProduct(id){
  if(!confirm('Delete this item?')) return;
  db.collection('products').doc(id).delete().then(loadProducts);
}

function filterProducts(type,btn){
  currentFilter=type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

const catIcon={product:'🛍️',service:'🔧',offer:'🎁'};
const statusBadge={available:'<span style="color:#4ade80;font-size:11px;font-weight:700">✅ Available</span>',soldout:'<span style="color:#f87171;font-size:11px;font-weight:700">❌ Sold Out</span>',coming:'<span style="color:#fbbf24;font-size:11px;font-weight:700">🔜 Coming Soon</span>'};

function renderProducts(){
  const items=currentFilter==='all'?allProducts:allProducts.filter(p=>p.category===currentFilter);
  const grid=document.getElementById('product-grid');
  if(!items.length){grid.innerHTML='<div class="empty-state"><div style="font-size:48px">📦</div><p>No items yet.</p></div>';return;}
  grid.innerHTML=items.map(item=>`<div class="product-card">
    <div class="card-img">${item.image?`<img src="${item.image}" alt="${item.name}">`:(catIcon[item.category]||'📦')}</div>
    <div class="card-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span class="badge ${item.category}">${catIcon[item.category]} ${(item.category||'').charAt(0).toUpperCase()+(item.category||'').slice(1)}</span>
        ${statusBadge[item.status]||''}
      </div>
      <div class="card-title">${item.name}</div>
      <div class="card-price">₹${item.price}${item.originalPrice?`<span style="color:#475569;font-size:13px;text-decoration:line-through;font-weight:400;margin-left:6px">₹${item.originalPrice}</span>`:''}</div>
      ${item.description?`<div class="card-desc">${item.description.substring(0,80)}${item.description.length>80?'...':''}</div>`:''}
      <div class="card-actions">
        <button class="btn-edit" onclick="editProduct('${item.id}')">✏️ Edit</button>
        <button class="btn-delete" onclick="deleteProduct('${item.id}')">🗑️ Delete</button>
      </div>
    </div>
  </div>`).join('');
}

function loadProducts(){
  db.collection('products').orderBy('date','desc').get().then(snap=>{
    allProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderProducts();
  }).catch(e=>document.getElementById('product-grid').innerHTML=`<p style="color:#f87171">Error: ${e.message}</p>`);
}
loadProducts();
</script>
</body>
</html>
