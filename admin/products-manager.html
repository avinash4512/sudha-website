<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Manager – Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA12PmJh2DGgujscaZrYmCUAepcqK5P6Bk",
  authDomain:"sudha-lic-website.firebaseapp.com",
  projectId:"sudha-lic-website",
  storageBucket:"sudha-lic-website.firebasestorage.app",
  messagingSenderId:"236994886282",
  appId:"1:236994886282:web:7072b506e8c739430fcb73"
});
var db=firebase.firestore();
var storage=firebase.storage();
</script>
<style>
.form-box{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:28px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:13px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea,.fg select{background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:10px 14px;font-size:14px;outline:none;font-family:inherit}
.fg input:focus,.fg textarea:focus{border-color:#6366f1}
.fg textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.fb{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.fb.active,.fb:hover{background:#6366f1;color:#fff;border-color:#6366f1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden;transition:.2s}
.pc:hover{border-color:#6366f1;transform:translateY(-2px)}
.pc-img{height:150px;background:#0f172a;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover}
.pc-body{padding:14px}
.pc-title{font-size:15px;font-weight:700;margin-bottom:4px}
.pc-price{font-size:18px;font-weight:800;color:#6366f1;margin-bottom:6px}
.pc-desc{font-size:12px;color:#64748b;margin-bottom:10px}
.pc-btns{display:flex;gap:8px}
.btn-e{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-d{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.msg{padding:12px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.ok{background:#14532d22;color:#4ade80;border:1px solid #14532d}
.msg.err{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
.empty{text-align:center;padding:40px;color:#64748b;grid-column:1/-1}
.uprog{font-size:12px;color:#6366f1;margin-top:4px;display:none}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⚙️ Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="upload.html">📤 Upload Media</a>
      <a href="news-manager.html">📰 News Posts</a>
      <a href="schemes-manager.html">📋 Schemes</a>
      <a href="products-manager.html" class="active">🛍️ Products</a>
      <a href="reviews-manager.html">⭐ Reviews</a>
      <a href="../index.html" style="color:#4ade80">🏠 View Website</a>
    </nav>
    <div style="padding:20px">
      <button onclick="logout()" style="width:100%;background:#7f1d1d;color:#fca5a5;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:14px">🚪 Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header"><h1>🛍️ Products & Services</h1><p>Manage your offerings</p></div>
    <div class="form-box">
      <h2 style="color:#f1f5f9;margin-bottom:18px;font-size:17px" id="form-title">➕ Add New Item</h2>
      <input type="hidden" id="edit-id">
      <div class="row2">
        <div class="fg"><label>Name *</label><input type="text" id="p-name" placeholder="e.g. LIC Policy Plan"></div>
        <div class="fg"><label>Category</label>
          <select id="p-cat"><option value="product">🛍️ Product</option><option value="service">🔧 Service</option><option value="offer">🎁 Special Offer</option></select>
        </div>
      </div>
      <div class="row3">
        <div class="fg"><label>Price (₹)</label><input type="text" id="p-price" placeholder="e.g. 999"></div>
        <div class="fg"><label>Original Price (₹)</label><input type="text" id="p-orig" placeholder="for discount"></div>
        <div class="fg"><label>Status</label>
          <select id="p-status"><option value="available">✅ Available</option><option value="soldout">❌ Sold Out</option><option value="coming">🔜 Coming Soon</option></select>
        </div>
      </div>
      <div class="fg"><label>Description</label><textarea id="p-desc" placeholder="Describe this item..."></textarea></div>
      <div class="row2">
        <div class="fg"><label>Features (one per line)</label><textarea id="p-feat" placeholder="Free Delivery&#10;24/7 Support" style="min-height:80px"></textarea></div>
        <div class="fg">
          <label>Image</label>
          <input type="text" id="p-img" placeholder="Paste image URL here">
          <div style="margin-top:8px;font-size:12px;color:#64748b">— or upload —</div>
          <input type="file" id="p-img-file" accept="image/*" onchange="uploadImg(this)" style="margin-top:6px;color:#94a3b8;font-size:13px">
          <div class="uprog" id="uprog">⏳ Uploading image...</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <button class="btn-primary" id="save-btn" onclick="saveProduct()">💾 Save Item</button>
        <button class="btn-secondary" onclick="clearForm()">✖ Cancel</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="filter-bar">
      <button class="fb active" onclick="filterItems('all',this)">All</button>
      <button class="fb" onclick="filterItems('product',this)">🛍️ Products</button>
      <button class="fb" onclick="filterItems('service',this)">🔧 Services</button>
      <button class="fb" onclick="filterItems('offer',this)">🎁 Offers</button>
    </div>
    <div class="grid" id="grid"><p class="empty">⏳ Loading...</p></div>
  </main>
</div>
<script>
if(!localStorage.getItem('admin_logged_in')) window.location.href='login.html';
function logout(){localStorage.removeItem('admin_logged_in');window.location.href='login.html';}
var allItems=[],currentFilter='all';
var catIcon={product:'🛍️',service:'🔧',offer:'🎁'};

function showMsg(t,type){var m=document.getElementById('msg');m.textContent=t;m.className='msg '+type;m.style.display='block';setTimeout(function(){m.style.display='none';},4000);}

function uploadImg(input){
  if(!input.files[0])return;
  var prog=document.getElementById('uprog');prog.style.display='block';
  var ref=storage.ref('products/'+Date.now()+'_'+input.files[0].name);
  var task=ref.put(input.files[0]);
  task.on('state_changed',null,
    function(e){prog.textContent='❌ Upload failed';},
    function(){task.snapshot.ref.getDownloadURL().then(function(url){document.getElementById('p-img').value=url;prog.textContent='✅ Image uploaded!';setTimeout(function(){prog.style.display='none';},2000);});}
  );
}

function saveProduct(){
  var name=document.getElementById('p-name').value.trim();
  if(!name){alert('Please enter item name!');return;}
  var btn=document.getElementById('save-btn');btn.disabled=true;btn.textContent='⏳ Saving...';
  var editId=document.getElementById('edit-id').value;
  var data={name:name,category:document.getElementById('p-cat').value,price:document.getElementById('p-price').value.trim(),originalPrice:document.getElementById('p-orig').value.trim(),status:document.getElementById('p-status').value,description:document.getElementById('p-desc').value.trim(),features:document.getElementById('p-feat').value.trim(),image:document.getElementById('p-img').value.trim(),date:firebase.firestore.FieldValue.serverTimestamp()};
  var p=editId?db.collection('products').doc(editId).update(data):db.collection('products').add(data);
  p.then(function(){showMsg('✅ Item saved!','ok');clearForm();loadItems();}).catch(function(e){showMsg('❌ Error: '+e.message,'err');}).finally(function(){btn.disabled=false;btn.textContent='💾 Save Item';});
}

function clearForm(){
  document.getElementById('edit-id').value='';
  ['p-name','p-price','p-orig','p-desc','p-feat','p-img'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('p-cat').value='product';
  document.getElementById('p-status').value='available';
  document.getElementById('form-title').textContent='➕ Add New Item';
}

function editItem(id){
  db.collection('products').doc(id).get().then(function(doc){
    var p=doc.data();
    document.getElementById('edit-id').value=id;
    document.getElementById('p-name').value=p.name||'';
    document.getElementById('p-cat').value=p.category||'product';
    document.getElementById('p-price').value=p.price||'';
    document.getElementById('p-orig').value=p.originalPrice||'';
    document.getElementById('p-status').value=p.status||'available';
    document.getElementById('p-desc').value=p.description||'';
    document.getElementById('p-feat').value=p.features||'';
    document.getElementById('p-img').value=p.image||'';
    document.getElementById('form-title').textContent='✏️ Edit Item';
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

function deleteItem(id){if(!confirm('Delete this item?'))return;db.collection('products').doc(id).delete().then(loadItems);}

function filterItems(type,btn){
  currentFilter=type;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderItems();
}

function renderItems(){
  var items=currentFilter==='all'?allItems:allItems.filter(function(p){return p.category===currentFilter;});
  var grid=document.getElementById('grid');
  if(!items.length){grid.innerHTML='<div class="empty"><div style="font-size:48px">📦</div><p>No items yet.</p></div>';return;}
  var html='';
  items.forEach(function(item){
    html+='<div class="pc"><div class="pc-img">'+(item.image?'<img src="'+item.image+'" alt="'+item.name+'">':(catIcon[item.category]||'📦'))+'</div><div class="pc-body"><div class="pc-title">'+item.name+'</div><div class="pc-price">₹'+item.price+(item.originalPrice?'<span style="color:#475569;font-size:12px;text-decoration:line-through;font-weight:400;margin-left:6px">₹'+item.originalPrice+'</span>':'')+'</div>'+(item.description?'<div class="pc-desc">'+item.description.substring(0,70)+'</div>':'')+'<div class="pc-btns"><button class="btn-e" onclick="editItem(\''+item.id+'\')">✏️ Edit</button><button class="btn-d" onclick="deleteItem(\''+item.id+'\')">🗑️ Delete</button></div></div></div>';
  });
  grid.innerHTML=html;
}

function loadItems(){
  db.collection('products').orderBy('date','desc').get().then(function(snap){
    allItems=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderItems();
  }).catch(function(e){document.getElementById('grid').innerHTML='<p style="color:#f87171;grid-column:1/-1">❌ '+e.message+'</p>';});
}
loadItems();
</script>
</body>
</html>
