<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found – YourBrand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0f1e;color:#e2e8f0;font-family:'Sora',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .icon{font-size:80px;margin-bottom:24px}
  h1{font-size:48px;font-weight:800;color:#6366f1;margin-bottom:12px}
  p{color:#64748b;font-size:18px;margin-bottom:32px}
  a{background:#6366f1;color:#fff;padding:13px 28px;border-radius:10px;text-decoration:none;font-weight:700;font-size:15px;transition:.2s;display:inline-block}
  a:hover{background:#4f46e5}
</style>
</head>
<body>
  <div>
    <div class="icon">🔍</div>
    <h1>404</h1>
    <p>Oops! The page you are looking for does not exist.</p>
    <a href="index.html">🏠 Go Back Home</a>
  </div>
</body>
</html>
